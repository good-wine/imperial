# Enterprise stack: api + worker + redis + postgres(pgvector) + ollama + dashboard.
# CPU:      docker compose up --build
# GPU:      docker compose --profile gpu up --build   (nvidia-container-toolkit required)
# Full vec: docker compose --profile full --profile gpu up --build
name: provenance

x-health-api: &health-api
  test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)\""]
  interval: 15s
  timeout: 5s
  retries: 10

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prov}
      POSTGRES_DB: ${POSTGRES_DB:-provenance}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-prov}"]
      interval: 10s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama-models:/root/.ollama]
    # No host port binding: the host already runs Ollama (with models) on
    # 11434. In-compose traffic uses http://ollama:11434 on the shared
    # network. To give the port to the container instead, stop the local
    # server and re-add: ports: ["11434:11434"].
    expose: ["11434"]
    profiles: ["full", "llm"]
    # Connected setup: docker compose exec ollama ollama pull llama3.1:8b

  qdrant:
    image: qdrant/qdrant:v1.11.0
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["6333:6333", "6334:6334"]
    # No healthcheck: minimal image ships no wget/curl. The app treats
    # Qdrant as fail-open (memory mirror) and logs unreachability.

  api:
    build:
      context: .
      target: api
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: provenance-api:latest
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prov}:${POSTGRES_PASSWORD:-prov}@postgres:5432/${POSTGRES_DB:-provenance}
      CELERY_BROKER_URL: redis://redis:6379/0
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_TIMEOUT_S: "300"
      QDRANT_URL: http://qdrant:6333
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models:ro
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_started}
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck: *health-api

  worker:
    build:
      context: .
      target: worker
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: provenance-worker:latest
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prov}:${POSTGRES_PASSWORD:-prov}@postgres:5432/${POSTGRES_DB:-provenance}
      CELERY_BROKER_URL: redis://redis:6379/0
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_TIMEOUT_S: "300"
      QDRANT_URL: http://qdrant:6333
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models:ro
    depends_on:
      redis: {condition: service_started}
      postgres: {condition: service_healthy}
      api: {condition: service_healthy}

  # Beat scheduler: OSINT poll (hourly :15) + retention sweep (daily 02:00).
  # Single replica only — two beats would double-schedule.
  beat:
    build:
      context: .
      target: worker
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: provenance-worker:latest
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prov}:${POSTGRES_PASSWORD:-prov}@postgres:5432/${POSTGRES_DB:-provenance}
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: ["celery", "-A", "worker.app", "beat", "--loglevel=info"]
    depends_on:
      redis: {condition: service_started}
      worker: {condition: service_started}
    profiles: ["full", "beat"]

  # GPU worker overlay: same image, NVIDIA runtime. Requires nvidia-docker.
  worker-gpu:
    extends: worker
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      FORCE_CPU: "0"

  dashboard:
    build: {context: ., target: dashboard}
    image: provenance-dashboard:latest
    env_file: [.env]
    environment:
      API_BASE: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}
    profiles: ["full", "ui"]

  milvus:
    image: milvusdb/milvus:v2.4.10
    command: ["milvus", "run", "standalone"]
    environment: {ETCD_USE_EMBED: "true", COMMON_STORAGETYPE: local}
    volumes: [milvus-data:/var/lib/milvus]
    profiles: ["full", "vector"]

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.1
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
    volumes: [weaviate-data:/var/lib/weaviate]
    profiles: ["full", "vector"]

  # SSO (opt-in): Keycloak IdP for OIDC analyst auth. Disabled by default;
  # enable with `--profile sso`, configure realm/client, then set
  # OIDC_ISSUER=http://keycloak:8080/realms/provenance OIDC_AUDIENCE=api.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-change-me}
    ports: ["8180:8080"]
    profiles: ["sso"]

  # oauth2-proxy in front of the dashboard: Streamlit itself has no login,
  # so the console is gated here when --profile sso is on. Public entry
  # becomes :4180 (authenticated) instead of :8501 (direct).
  # Provider config comes from env (see .env.example OIDC_*); empty values
  # make oauth2-proxy itself refuse to start (fail closed, sso only).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6
    command:
      - --provider=oidc
      - --oidc-issuer-url=${OIDC_ISSUER:-}
      - --client-id=${OIDC_CLIENT_ID:-dashboard}
      - --client-secret=${OIDC_CLIENT_SECRET:-}
      - --cookie-secret=${OAUTH2_COOKIE_SECRET:-}
      - --email-domain=*
      - --upstream=http://dashboard:8501
      - --http-address=0.0.0.0:4180
      - --cookie-secure=false
      - --pass-access-token=true
      - --set-xauthrequest=true
    ports: ["4180:4180"]
    depends_on:
      dashboard: {condition: service_started}
    profiles: ["sso"]

volumes:
  pgdata:
  redis-data:
  ollama-models:
  qdrant-data:
  milvus-data:
  weaviate-data:
