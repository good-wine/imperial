[project]
name = "provenance-engine"
version = "4.4.0"
description = "Geopolitical Media Provenance & Verification Engine — offline-first intelligence platform for image/video/audio authenticity"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Provenance Engine" }]
keywords = ["forensics", "c2pa", "deepfake", "geoint", "osint", "stix"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "ImageHash>=4.3",
  "opencv-python-headless>=4.8",
  "ollama>=0.2",
  "onnxruntime>=1.17",
  "onnx>=1.17",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "cbor2>=5.6",
  "cryptography>=42.0",
  "c2pa-python>=0.30",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "celery>=5.3",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pymilvus>=2.3",
  "weaviate-client>=4.0",
  "qdrant-client>=1.11",
  "librosa>=0.10",
  "openai-whisper>=20250625",
  "transformers>=4.40",
  "llama-index>=0.10",
  "torch>=2.2",
  "streamlit>=1.33",
  "requests>=2.31",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.10",
  "bandit>=1.7",
  "pre-commit>=3.0",
]
docs = []

[project.scripts]
provenance = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "ingestion*", "security*"]

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "fuzz: property-based parser hardening (hypothesis)",
  "needs_gpu: marks tests requiring CUDA",
  "needs_net: marks tests requiring network Streamlit/HF Hub",
]

[tool.coverage.run]
source = ["src", "ingestion", "security", "main", "worker"]
omit = ["*/tests/*", "src/rust_bridge/*"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "except ImportError:",
  "except ModuleNotFoundError:",
]
show_missing = true

# ------------------------------------------------------------------ ruff
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "__pycache__", "rust/"]

[tool.ruff.lint]
select = [
  "E", "F",          # pycodestyle errors, pyflakes
  "I",               # isort
  "UP",              # pyupgrade
  "B",               # flake-bugbear
  "S",               # bandit
  "BLE",             # blind except
  "ASYNC",           # async pitfalls
  "SIM",             # simplifications
  "PERF",            # performance
  "C", "C90",       # comprehensions, complexity
  "RUF",             # ruff-specific
  "FURB",            # refurb
  "ISC",             # implicit str concat
  "PIE",             # misc
  "PLR0402",         # manual from-import
]
ignore = [
  # --- deliberate architecture, documented in docs/ARCHITECTURE.md ---
  # Fail-open by design: every engine leg degrades to SKIPPED with a logged
  # reason instead of aborting the intelligence pipeline. Broad catches are
  # the mechanism, not a smell — each logs at warning+ with context.
  "BLE001",
  "S110",  # try-except-pass  (same fail-open pattern)
  "S112",  # try-except-continue
  # Test-only conveniences
  "S101",  # asserts in tests
  # --- operator-controlled behavior, not vulnerabilities ---
  # S310: outbound fetch IS the OSINT feature; URLs come from operator
  # config (OSINT_RSS_FEEDS / Telegram), never from untrusted input.
  "S310",
  # S108: /tmp/opencode is the pre-approved scratch dir (see env docs),
  # not an insecure-tempfile pattern.
  "S108",
  # RUF001/RUF002: → × ≈ ± in docstrings/comments are typography, and
  # identifiers are ASCII-only (enforced by Python itself).
  "RUF001",
  "RUF002",
]
unfixable = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"dashboard/*" = ["S110"]
"scripts/*" = ["S110", "S112"]
# B008 in main.py: `file: UploadFile = File(...)` is the canonical FastAPI
# Depends idiom — there is no module-level-singleton alternative.
"main.py" = ["B008"]

[tool.ruff.lint.mccabe]
max-complexity = 15

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
# Pragmatic strictness for a glue-heavy multimodal codebase: third-party
# vision/LLM SDKs are dynamically typed; our contracts (schemas.py) are
# fully annotated instead. Entry points (run with `make typecheck`):
#   mypy src ingestion security main.py worker.py
disallow_untyped_defs = false
check_untyped_defs = true

# ------------------------------------------------------------------ bandit
[tool.bandit]
exclude_dirs = [".venv", "rust"]
# B101: asserts live in tests/ only (ruff S101 governs the same).
# B108/B110/B112: the pipeline's fail-open contract — every engine leg
# degrades to SKIPPED with a logged reason instead of aborting analysis.
# B310: all outbound fetch funnels through src/security.fetch_url, which
# allowlists http(s) and caps response size; residual flags carry inline nosec.
skips = ["B101", "B108", "B110", "B112"]
