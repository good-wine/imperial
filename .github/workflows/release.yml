name: release
# Tag push (v*) -> multi-arch images to GHCR, keyless-signed with cosign
# (Sigstore OIDC, no long-lived secrets) + SLSA attestations.
# Verify: cosign verify ghcr.io/<org>/provenance-api:<tag>

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ github.ref_name }}
          build-args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
      - name: Sign image
        run: >
          cosign sign --yes
          ghcr.io/${{ github.repository }}-${{ matrix.target }}@${{ steps.push.outputs.digest }}
      - name: SBOM for attestation
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ github.ref_name }}
          output-file: reports/sbom.json
      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: reports/sbom.json
