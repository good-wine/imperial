name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Format check
        run: make format-check
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Security scan
        run: make security
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          make audit
      - name: Tests + coverage ratchet
        run: make coverage
      - name: Adversarial eval
        run: make eval

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Format check
        run: cargo fmt --manifest-path rust/provenance-jumbf/Cargo.toml --check
      - name: Rust tests (provenance-jumbf)
        run: cargo test --manifest-path rust/provenance-jumbf/Cargo.toml
